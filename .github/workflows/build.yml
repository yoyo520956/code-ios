name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  swift-test:
    name: Swift Package Test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Version
        run: |
          swift --version
          echo ""

      - name: Build Package
        run: |
          swift build
          echo "✅ Swift package build completed"

      - name: Run Tests
        run: |
          swift test
          echo "✅ Swift tests completed"