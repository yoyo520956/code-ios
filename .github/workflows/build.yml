name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    
    - name: Build
      run: |
        echo "=== Building Project ==="
        # 使用当前目录下的 Xcode 项目
        xcodebuild build \
          -project Code.xcodeproj \
          -scheme Code \
          -configuration Debug \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build.log
        
        # 检查构建结果
        if grep -q "BUILD SUCCEEDED" build.log; then
          echo "✅ Build succeeded!"
        else
          echo "❌ Build failed!"
          tail -50 build.log
          exit 1
        fi
    
    - name: Export IPA
      if: success()
      run: |
        echo "=== Exporting IPA ==="
        # 查找 .app 文件
        APP_PATH=$(find DerivedData -name "*.app" 2>/dev/null | head -1)
        echo "Found app: $APP_PATH"
        
        if [ -z "$APP_PATH" ]; then
          # 尝试其他路径
          APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | head -1)
          echo "Found app at: $APP_PATH"
        fi
        
        # 创建 Payload 目录
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/ 2>/dev/null || true
        
        # 打包 IPA
        if [ -d "Payload/$(basename $APP_PATH)" ]; then
          cd Payload
          zip -qr ../Code-unsigned.ipa .
          cd ..
          echo "✅ IPA created: $(ls -lh Code-unsigned.ipa)"
        else
          echo "⚠️ 无法找到 .app 文件，尝试其他方式..."
          # 直接使用构建目录
          find . -name "*.app" -exec zip -rq Code-unsigned.ipa {} \; 2>/dev/null
        fi
    
    - name: Upload IPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Code-unsigned
        path: Code-unsigned.ipa
