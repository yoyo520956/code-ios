name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    
    - name: Test
      run: |
        echo "Hello from GitHub Actions!"
        swift --version
        ls -la
        echo "Files in Sources:"
        ls -la Sources/
        echo "Package.swift content:"
        cat Package.swift
