name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift Version
        run: swift --version

      - name: List Files
        run: |
          echo "Root directory:"
          ls -la
          echo ""
          echo "Sources directory:"
          ls -la Sources/ || echo "No Sources directory"
          echo ""
          echo "Package.swift:"
          cat Package.swift || echo "No Package.swift"

      - name: Build
        run: |
          swift build
          echo "✅ Build completed"
