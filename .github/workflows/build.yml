name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.0'
    
    - name: Install XcodeGen
      run: brew install xcodegen
    
    - name: Generate Xcode Project
      run: |
        echo "=== Generating Xcode Project ==="
        xcodegen generate
        echo "✅ Project generated successfully"
        ls -la *.xcodeproj
    
    - name: Build
      run: |
        echo "=== Building Project ==="
        xcodebuild build \
          -project Code.xcodeproj \
          -scheme Code \
          -configuration Debug \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build.log
        
        if grep -q "BUILD SUCCEEDED" build.log; then
          echo "✅ Build succeeded!"
        else
          echo "❌ Build failed!"
          tail -50 build.log
          exit 1
        fi
    
    - name: Export IPA
      if: success()
      run: |
        echo "=== Exporting IPA ==="
        # 查找 .app 文件
        APP_PATH=$(find DerivedData -name "*.app" 2>/dev/null | head -1)
        echo "Found app: $APP_PATH"
        
        # 创建 Payload 目录
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        
        # 打包 IPA
        cd Payload
        zip -qr ../Code-unsigned.ipa .
        cd ..
        
        echo "✅ IPA created: $(ls -lh Code-unsigned.ipa)"
    
    - name: Upload IPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Code-unsigned
        path: Code-unsigned.ipa
