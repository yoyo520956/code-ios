name: Build IPA

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - 'Resources/**'
      - '.github/workflows/ipa.yml'
  workflow_dispatch:

jobs:
  ipa:
    name: Build IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la *.xcodeproj

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme Code \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Code.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -30

      - name: Export IPA (Unsigned)
        run: |
          echo "=== xcarchive 结构 ==="
          find build/Code.xcarchive -maxdepth 4 -type d | head -20
          
          # 按 GLOBAL 铁律：.app 在 Products/Applications/
          APP_PATH="build/Code.xcarchive/Products/Applications/Code.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "⚠️ 未找到预期路径，搜索所有 .app"
            APP_PATH=$(find build -name "*.app" -type d | head -1)
          fi
          
          echo "App path: $APP_PATH"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ 无法找到 .app"
            exit 1
          fi
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          cd Payload
          zip -qry ../Code-unsigned.ipa .
          cd ..
          
          ls -lh Code-unsigned.ipa
          shasum -a 256 Code-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Code-unsigned-ipa
          path: Code-unsigned.ipa
          retention-days: 7
