name: Build IPA

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - 'Resources/**'
      - '.github/workflows/ipa.yml'
  workflow_dispatch:

jobs:
  ipa:
    name: Build IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la *.xcodeproj

      - name: Build (DerivedData)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Code.xcodeproj \
            -scheme Code \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log | tail -20

          if ! grep -q "BUILD SUCCEEDED" build.log; then
            echo "❌ Build failed"
            tail -60 build.log
            exit 1
          fi
          echo "✅ Build succeeded"

      - name: Export IPA (Unsigned)
        run: |
          echo "=== 查找 .app ==="
          find build -name "*.app" -type d
          
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -1)
          echo "App path: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 无法找到 .app"
            exit 1
          fi
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          cd Payload
          zip -qry ../Code-unsigned.ipa .
          cd ..
          
          ls -lh Code-unsigned.ipa
          shasum -a 256 Code-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Code-unsigned-ipa
          path: Code-unsigned.ipa
          retention-days: 7
