name: Build IPA

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - 'Resources/**'
      - '.github/workflows/ipa.yml'
  workflow_dispatch:

jobs:
  ipa:
    name: Build IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Code.xcodeproj \
            -scheme Code \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            > build.log 2>&1 || true

          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "✅ Build succeeded"
          else
            echo "❌ Build failed — 错误详情："
            grep -E "error:" build.log | head -30
            tail -40 build.log
            exit 1
          fi

      - name: Export IPA (Unsigned)
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -1)
          echo "App path: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "❌ 无法找到 .app"
            find build -type d | head -30
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 关键：不 cd 进 Payload，直接从根目录 zip Payload/，保证 IPA 根目录有 Payload/
          zip -qry Code-unsigned.ipa Payload

          echo "=== IPA 结构验证 ==="
          unzip -l Code-unsigned.ipa | head -5

          ls -lh Code-unsigned.ipa
          shasum -a 256 Code-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Code-unsigned-ipa
          path: Code-unsigned.ipa
          retention-days: 7
